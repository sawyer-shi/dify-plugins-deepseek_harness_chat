identity:
  name: chat
  author: sawyer-shi
  label:
    en_US: DeepSeek Harness Chat
    zh_Hans: DeepSeek Harness 对话
description:
  human:
    en_US: >
      Chat with a local DeepSeek Harness (DSH) agent through the dsh-openai-gateway
      OpenAI-compatible API. Each call runs in a real agent session with tools and a
      workspace. Supports sticky sessions and returns files (Excel, CSV, PDF, ...)
      generated by the agent during this turn.
    zh_Hans: >
      通过 dsh-openai-gateway 的 OpenAI 兼容 API 与本地 DeepSeek Harness (DSH) Agent
      对话。每次调用都在带工具与工作区的真实 Agent 会话中执行。支持粘性会话，
      并可将本轮生成的文件（Excel、CSV、PDF 等）直接返回到对话。
  llm: >
    Tool for chatting with a local DeepSeek Harness coding agent. Send a user message
    (prompt); the agent replies after running its own tools in its local workspace.
    Files produced during the turn are returned as downloadable attachments.
extra:
  python:
    source: tools/chat.py
parameters:
  - name: prompt
    type: string
    required: true
    label:
      en_US: Prompt
      zh_Hans: 用户消息
    human_description:
      en_US: The user message sent to the DSH agent for this turn.
      zh_Hans: 本轮发送给 DSH Agent 的用户消息；粘性会话下只需填写新消息。
    llm_description: The user message to send to the DeepSeek Harness agent for this turn.
    form: llm
  - name: files
    type: files
    required: false
    label:
      en_US: Attached Files
      zh_Hans: 随消息上传的文件
    human_description:
      en_US: >
        Files uploaded with this message. They are uploaded into the DSH agent
        workspace first, then the agent is told to read them with its workspace
        tools before answering.
      zh_Hans: >
        随消息上传的文件（可多选）。会先上传到 DSH Agent 的工作区，并提示 Agent
        用工作区工具读取这些文件后再完成任务。
    llm_description: >
      Optional files attached by the user (documents, spreadsheets, images...).
      Pass them through when the user uploaded attachments for this task.
    form: llm
  - name: model
    type: string
    required: false
    default: default
    label:
      en_US: Model
      zh_Hans: 模型
    human_description:
      en_US: 'Model name: "default", "provider/model", or a bare model name.'
      zh_Hans: '模型名："default"（跟随 DSH 默认模型）、"provider/model" 精确路由，或裸模型名。'
    form: form
  - name: session_scope
    type: select
    required: false
    default: session
    label:
      en_US: Session Scope
      zh_Hans: 会话级别
    human_description:
      en_US: >
        session: one agent per Dify conversation; user: one agent per Dify user across
        conversations; none: stateless single turn.
      zh_Hans: >
        会话级：同一 Dify 会话复用同一 Agent；用户级：同一 Dify 用户跨会话复用同一
        Agent；无状态：每次调用独立。
    form: form
    options:
      - value: session
        label:
          en_US: Session
          zh_Hans: 会话级
      - value: user
        label:
          en_US: User
          zh_Hans: 用户级
      - value: none
        label:
          en_US: Stateless
          zh_Hans: 无状态
  - name: timeout_seconds
    type: number
    required: false
    default: 300
    label:
      en_US: Timeout (seconds)
      zh_Hans: 超时（秒）
    human_description:
      en_US: Per-turn timeout in seconds. Agent turns can take minutes.
      zh_Hans: 单轮超时（秒）。Agent 单轮执行可能耗时数分钟。
    form: form
  - name: include_reasoning
    type: boolean
    required: false
    default: false
    label:
      en_US: Include Reasoning
      zh_Hans: 附带思考内容
    human_description:
      en_US: If enabled, prepend the agent's thinking as a <think> block.
      zh_Hans: 开启后在回复正文前以 &lt;think&gt; 段附带思考内容。
    form: form
  - name: return_files
    type: boolean
    required: false
    default: true
    label:
      en_US: Return Generated Files
      zh_Hans: 返回生成的文件
    human_description:
      en_US: >
        If enabled, files created in the agent workspace during this turn
        (e.g. Excel/CSV/PDF) are returned as downloadable attachments.
      zh_Hans: >
        开启后，本轮在 Agent 工作区新生成的文件（如 Excel/CSV/PDF）会作为附件返回到对话。
    form: form
  - name: max_files
    type: number
    required: false
    default: 5
    label:
      en_US: Max Files Per Turn
      zh_Hans: 每轮最多返回文件数
    human_description:
      en_US: Upper limit (1-10) on how many newly created files are returned per turn.
      zh_Hans: 每轮最多返回的新文件数量上限（1-10）。
    form: form
  - name: max_text_chars
    type: number
    required: false
    default: 6000
    label:
      en_US: Max Reply Characters
      zh_Hans: 回复文本上限（字符）
    human_description:
      en_US: >
        Cap on how many characters of the DSH agent's text reply are returned.
        0 = no limit. Large reports can exhaust the Dify app's output tokens and
        cause truncation; generated files are returned as attachments regardless.
      zh_Hans: >
        返回给 Dify 的 DSH Agent 文本回复的最大字符数，0 表示不限制。过长的报告会撑爆
        Dify 应用的输出 token 导致截断；生成的文件不受影响，始终作为附件返回。
    form: form
  - name: max_tokens
    type: number
    required: false
    default: 32768
    label:
      en_US: Max Output Tokens (DSH turn)
      zh_Hans: DSH 单轮输出上限（tokens）
    human_description:
      en_US: >
        Output token cap sent to the DSH agent for this turn. Small values
        (e.g. 8192) truncate long agent turns mid-answer (finish_reason=length).
        DSH clamps this to the model's capacity. 0 falls back to the DSH default.
      zh_Hans: >
        传给 DSH Agent 本轮的输出 token 上限。过小（如 8192）会导致长回复中途被截断。
        DSH 会按模型实际容量自动钳制。0 表示跟随 DSH 默认。
    form: form
  - name: file_extensions
    type: string
    required: false
    label:
      en_US: File Extensions Filter
      zh_Hans: 返回文件的扩展名过滤
    human_description:
      en_US: >
        Empty (default): only deliverable types are returned (xlsx/xls/csv/pdf/
        docx/pptx/txt/md/images/html/json/zip). "*" returns every new file
        including intermediate build scripts. Or a comma-separated list like
        "xlsx,csv,pdf".
      zh_Hans: >
        留空（默认）：只返回交付类文件（xlsx/xls/csv/pdf/docx/pptx/txt/md/图片/
        html/json/zip），Agent 生成的中间脚本（.py 等）不返回；"*" 返回全部新文件；
        或填逗号分隔的白名单，如 "xlsx,csv,pdf"。
    form: form
